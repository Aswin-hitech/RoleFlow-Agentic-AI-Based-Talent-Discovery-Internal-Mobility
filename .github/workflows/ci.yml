name: RoleFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Linting, Scoring Engine & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-flask
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Deterministic Scoring & RBAC Tests
        run: |
          python -m pytest -v tests/

      - name: Run Matching Quality IR Benchmark
        run: |
          python backend/evaluation/matching_benchmark.py

  frontend-build:
    name: Frontend React 19 Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build
