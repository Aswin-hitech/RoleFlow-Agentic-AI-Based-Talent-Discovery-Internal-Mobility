  <!-- Column 2: Grounded AI Career Assistant (Width: 380, Left: 410) -->
  <g transform="translate(410, 85)" filter="url(#shadow)">
    <rect width="370" height="550" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
