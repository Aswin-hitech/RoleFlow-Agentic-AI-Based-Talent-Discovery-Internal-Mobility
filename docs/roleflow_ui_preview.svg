    <!-- Governance Header -->
    <rect width="360" height="54" rx="12" fill="#1e3a8a" />
    <text x="20" y="33" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">3. Responsible AI &amp; Governance</text>

    <!-- EEOC Four-Fifths Metric Box -->
    <g transform="translate(16, 70)">
      <rect width="328" height="140" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <text x="14" y="24" fill="#166534" font-family="sans-serif" font-size="12" font-weight="700">EEOC 4/5ths Rule Fairness Audit</text>
      
      <text x="14" y="46" fill="#334155" font-family="sans-serif" font-size="10.5">Status: </text>
      <text x="56" y="46" fill="#16a34a" font-family="sans-serif" font-size="10.5" font-weight="700">COMPLIANT (100% Pass)</text>

      <text x="14" y="68" fill="#475569" font-family="sans-serif" font-size="10">Disparate Impact Ratio across Depts:</text>
      <text x="14" y="86" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="600">Data &amp; AI: 1.00 · Engineering: 0.92 · Quality: 0.88</text>
      <rect x="14" y="96" width="300" height="6" rx="3" fill="#e2e8f0" />
      <rect x="14" y="96" width="270" height="6" rx="3" fill="#10b981" />
      <text x="14" y="122" fill="#64748b" font-family="sans-serif" font-size="9.5">All ratios &gt;= 0.80 (No demographic or tenure skew)</text>
    </g>

    <!-- Human-in-the-Loop Override Box -->
    <g transform="translate(16, 226)">
      <rect width="328" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="14" y="24" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">Human-in-the-Loop Override</text>
      <text x="14" y="40" fill="#64748b" font-family="sans-serif" font-size="10">Legal requirement: &gt;= 10 char justification</text>

      <rect x="14" y="52" width="300" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="22" y="70" fill="#1e293b" font-family="sans-serif" font-size="10">"Candidate has 2 years leading similar</text>
      <text x="22" y="86" fill="#1e293b" font-family="sans-serif" font-size="10">RAG pipelines in customer analytics."</text>

      <!-- Score adjustment pill -->
      <rect x="14" y="112" width="130" height="22" rx="4" fill="#eff6ff" />
      <text x="22" y="127" fill="#1e40af" font-family="sans-serif" font-size="9.5" font-weight="600">Fit: 79 ➔ 92 (Approved)</text>
    </g>

    <!-- Transfer Governance Approvals -->
    <g transform="translate(16, 390)">
      <rect width="328" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="14" y="22" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">Workforce Mobility Approvals</text>

      <!-- Transfer row -->
      <text x="14" y="46" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="600">Arjun Mehta ➔ AI Platform Engineer</text>
      <text x="14" y="62" fill="#64748b" font-family="sans-serif" font-size="9.5">Manager Shortlisted ✓ · Employee Accepted ✓</text>

      <rect x="14" y="74" width="90" height="22" rx="4" fill="#fef3c7" />
      <text x="22" y="89" fill="#92400e" font-family="sans-serif" font-size="9.5" font-weight="700">PENDING HR</text>

      <rect x="115" y="72" width="195" height="26" rx="6" fill="#16a34a" />
      <text x="142" y="89" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">1-Click HR Approval</text>

      <!-- Audit Stamp -->
      <text x="14" y="122" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Immutable Audit ID: #AUD-88219 · Logged to MongoDB</text>
    </g>
  </g>
</svg>
