<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16" />

  <!-- Title & Status Header -->
  <text x="50" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">RoleFlow — Enterprise Internal Talent Mobility Platform</text>
  <rect x="790" y="32" width="110" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <circle cx="804" cy="45" r="4" fill="#10b981" />
  <text x="816" y="49" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">ONLINE v1.2</text>
  <rect x="915" y="32" width="125" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
  <text x="928" y="49" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">EEOC COMPLIANT</text>
  <rect x="1055" y="32" width="95" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="1067" y="49" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">SWAPPABLE LLM</text>

  <!-- Column 1: Manager Talent Discovery Portal (Width: 360, Left: 40) -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="350" height="550" rx="12" fill="url(#whiteCard)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Header -->
    <rect width="350" height="54" rx="12" fill="#1e3a8a" />
    <text x="20" y="33" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">1. Manager Talent Discovery</text>
    
    <!-- Subtitle / Role -->
    <text x="20" y="80" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">OPEN VACANCY</text>
    <text x="20" y="100" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="800">Senior AI Platform Engineer</text>
    <text x="20" y="118" fill="#475569" font-family="sans-serif" font-size="11">Data &amp; AI Platform · Min 4 Yrs Exp</text>

    <!-- Candidate Card: Arjun Mehta -->
    <g transform="translate(16, 136)">
      <rect width="318" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="26" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700">Arjun Mehta</text>
      <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Data Analyst (EMP-1024) · 4.5 yrs exp</text>

      <!-- Fit Badge -->
      <rect x="220" y="12" width="84" height="24" rx="12" fill="#dcfce7" stroke="#86efac" />
      <text x="232" y="28" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="700">92% FIT</text>

      <!-- Readiness Badge -->
      <rect x="220" y="42" width="84" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="228" y="56" fill="#1d4ed8" font-family="sans-serif" font-size="10" font-weight="600">85% READINESS</text>

      <!-- Metric Bars -->
      <text x="14" y="78" fill="#475569" font-family="sans-serif" font-size="10" font-weight="600">Direct Skills (30%)</text>
      <rect x="14" y="84" width="180" height="6" rx="3" fill="#e2e8f0" />
      <rect x="14" y="84" width="162" height="6" rx="3" fill="#2563eb" />
      <text x="200" y="90" fill="#64748b" font-family="sans-serif" font-size="9">27/30</text>

      <text x="14" y="110" fill="#475569" font-family="sans-serif" font-size="10" font-weight="600">Experience (25%)</text>
      <rect x="14" y="116" width="180" height="6" rx="3" fill="#e2e8f0" />
      <rect x="14" y="116" width="168" height="6" rx="3" fill="#10b981" />
      <text x="200" y="122" fill="#64748b" font-family="sans-serif" font-size="9">23/25</text>

      <text x="14" y="142" fill="#475569" font-family="sans-serif" font-size="10" font-weight="600">Transferable Skills (10%)</text>
      <rect x="14" y="148" width="180" height="6" rx="3" fill="#e2e8f0" />
      <rect x="14" y="148" width="160" height="6" rx="3" fill="#8b5cf6" />
      <text x="200" y="154" fill="#64748b" font-family="sans-serif" font-size="9">9/10</text>

      <!-- Action Button -->
      <rect x="14" y="162" width="290" height="2" fill="#e2e8f0" />
    </g>

    <!-- Shortlist Action -->
    <rect x="16" y="328" width="318" height="38" rx="6" fill="#2563eb" />
    <text x="95" y="352" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Shortlist Candidate (1-Click)</text>

    <!-- Candidate 2 Snippet -->
    <g transform="translate(16, 380)">
      <rect width="318" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="14" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">Priya Sharma</text>
      <text x="14" y="40" fill="#64748b" font-family="sans-serif" font-size="10">ML Platform Engineer · 5.0 yrs exp</text>
      <rect x="230" y="14" width="74" height="22" rx="11" fill="#dcfce7" />
      <text x="242" y="29" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="700">95% FIT</text>
    </g>

    <g transform="translate(16, 460)">
      <rect width="318" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="14" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">Kavita Raman</text>
      <text x="14" y="40" fill="#64748b" font-family="sans-serif" font-size="10">Software Engineer · 3.5 yrs exp</text>
      <rect x="230" y="14" width="74" height="22" rx="11" fill="#fef3c7" />
      <text x="242" y="29" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="700">81% FIT</text>
    </g>
