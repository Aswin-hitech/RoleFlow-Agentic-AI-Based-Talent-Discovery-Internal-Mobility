      <text x="20" y="68" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="600">Active Project: Customer Analytics (75% done)</text>
      <text x="20" y="82" fill="#7f1d1d" font-family="sans-serif" font-size="9.5">Remaining: 3 weeks (-6 pts readiness deduction)</text>

      <text x="12" y="104" fill="#334155" font-family="sans-serif" font-size="10.5">You gain full points for Open to Transfer (30/30)</text>
      <text x="12" y="120" fill="#334155" font-family="sans-serif" font-size="10.5">and Career Interest alignment (25/25).</text>

