      <text x="0" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">SUGGESTED ACTIONS</text>
      
      <rect x="0" y="22" width="160" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="12" y="38" fill="#2563eb" font-family="sans-serif" font-size="10" font-weight="600">Show My Learning Plan</text>

      <rect x="168" y="22" width="170" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="180" y="38" fill="#2563eb" font-family="sans-serif" font-size="10" font-weight="600">Explain Fit Breakdown</text>

      <rect x="0" y="52" width="180" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="12" y="68" fill="#2563eb" font-family="sans-serif" font-size="10" font-weight="600">What skills should I learn?</text>
    </g>

    <!-- Chat Input Box -->
    <g transform="translate(14, 480)">
      <rect width="342" height="42" rx="21" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="16" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11">Ask about your career paths, match scores...</text>
      <circle cx="318" cy="21" r="14" fill="#2563eb" />
      <text x="313" y="25" fill="#ffffff" font-family="sans-serif" font-size="11">➔</text>
    </g>
  </g>

  <!-- Column 3: Responsible AI & HR Governance (Width: 360, Left: 800) -->
