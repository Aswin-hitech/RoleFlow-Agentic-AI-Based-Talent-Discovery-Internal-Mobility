      <text x="12" y="22" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="600">Based on your verified project data:</text>
      <text x="12" y="42" fill="#334155" font-family="sans-serif" font-size="10.5">Your Readiness is 85/100 due to 1 deduction:</text>
      
