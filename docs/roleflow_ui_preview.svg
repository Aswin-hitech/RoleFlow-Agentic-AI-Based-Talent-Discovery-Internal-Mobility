      <rect x="12" y="128" width="168" height="16" rx="8" fill="#dcfce7" />
      <text x="20" y="140" fill="#166534" font-family="sans-serif" font-size="8.5" font-weight="700">✓ Verified from project records</text>
    </g>

    <!-- Dynamic Suggestion Chips -->
